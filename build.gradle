plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.147'
	id 'com.diffplug.spotless' version '8.10.2'
}

version = mod_version
group = 'com.altnoir.mementoinabyss'
base.archivesName = mod_id

java {
	toolchain.languageVersion = JavaLanguageVersion.of(25)
	withSourcesJar()
}

repositories {
	if (providers.gradleProperty('useLocalMia').map { it.toBoolean() }.getOrElse(false)) {
		mavenLocal {
			content {
				includeModule 'com.altnoir.mementoinabyss', 'MementoInAbyss-26.1.2-NeoForge'
			}
		}
	}
	mavenCentral()
	maven { url = 'https://maven.ringlo.im/releases' }
	maven { url = 'https://maven.tamaized.com/releases' }
	maven { url = 'https://maven.createmod.net' }
	maven { url = 'https://maven.theillusivec4.top' }
	maven { url = 'https://maven.fzzyhmstrs.me' }
	maven { url = 'https://thedarkcolour.github.io/KotlinForForge' }
	maven { url = 'https://maven.blamejared.com' }
	maven { url = 'https://api.modrinth.com/maven' }
	maven { url = 'https://maven.caffeinemc.net/releases' }
}

dependencies {
	implementation "com.altnoir.mementoinabyss:MementoInAbyss-26.1.2-NeoForge:${mia_version}"
	implementation "team-twilight:twilightforest:${twilightforest_version}"
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
	exclude '**/.cache/**'
}

neoForge {
	version = project.neo_version
	runs {
		client { client() }
		server {
			server()
			programArgument '--nogui'
		}
		data {
			clientData()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
		}
	}
	mods {
		"${mod_id}" { sourceSet sourceSets.main }
	}
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
	def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, neo_version: neo_version, minecraft_version: minecraft_version, mia_version: mia_version, twilightforest_version: twilightforest_version]
	inputs.properties properties
	expand properties
	from 'src/main/templates'
	into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = 'MementoInAbyss-Twilight-26.1.2-NeoForge'
		}
	}
}

spotless {
	format 'misc', {
		target '*.gradle', '.gitignore'
		trimTrailingWhitespace()
		leadingSpacesToTabs()
		endWithNewline()
	}
	java {
		googleJavaFormat('1.36.1').aosp().reflowLongStrings().skipJavadocFormatting()
		formatAnnotations()
	}
}
