license="MIT"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Altnoir, RingLo_, zljtt, zhaijineet"
description='''Twilight Forest biomes, vegetation and landmarks adapted to Memento In Abyss Layer2.'''

[[mixins]]
config="mementoinabyss_twilight.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mementoinabyss"
type="required"
versionRange="[${mia_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="twilightforest"
type="required"
versionRange="[${twilightforest_version},)"
ordering="AFTER"
side="BOTH"
